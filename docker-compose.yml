services:
  postgresql:
    image: postgres:15-alpine
    container_name: portfolio-service-postgres
    environment:
      POSTGRES_DB: portfolio_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PORTFOLIO_SERVICE_DB_PASSWORD:-portfolio_service_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "${PORTFOLIO_SERVICE_DB_PORT:-5436}:5432"
    volumes:
      - portfolio_service_postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio-service-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4.8.1
    container_name: portfolio-service-adminer
    ports:
      - "${PORTFOLIO_SERVICE_ADMINER_PORT:-8094}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgresql
      ADMINER_DESIGN: pepa-linha
    networks:
      - portfolio-service-network
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  # Native by default (Dockerfile). For JVM: DOCKERFILE=Dockerfile.jvm docker compose up --build
  portfolio-service:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: portfolio-service-application
    ports:
      - "${PORTFOLIO_SERVICE_PORT:-8087}:8087"
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGDATABASE: portfolio_service_db
      PGUSER: postgres
      PGPASSWORD: ${PORTFOLIO_SERVICE_DB_PASSWORD:-portfolio_service_pass}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      PORT: 8087
      QUARKUS_PROFILE: prod
      PORTFOLIO_BASE_CURRENCY: ${PORTFOLIO_BASE_CURRENCY:-USD}
    networks:
      - portfolio-service-network
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/q/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  portfolio_service_postgres_data:

networks:
  portfolio-service-network:
    driver: bridge
