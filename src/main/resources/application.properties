# Quarkus HTTP Configuration
quarkus.http.port=${PORT:8087}
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
# Comma-separated allowlist. The VPC-edge trust model (see UserIdentityFilter) assumes X-User-Id
# is set by a trusted upstream, not directly by a browser -- a wildcard origin combined with
# x-user-id in the allowed headers below would let any web page impersonate any user. Set
# CORS_ALLOWED_ORIGINS to the real frontend origin(s) in production.
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,cache-control,connection,x-request-id,x-user-id
quarkus.http.cors.exposed-headers=content-type,cache-control,connection,x-request-id
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.access-control-max-age=3600

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PGUSER:postgres}
quarkus.datasource.password=${PGPASSWORD:portfolio_service_pass}
quarkus.datasource.reactive.url=postgresql://${PGHOST:localhost}:${PGPORT:5436}/${PGDATABASE:portfolio_service_db}
quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5436}/${PGDATABASE:portfolio_service_db}
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.idle-timeout=PT10M

# Hibernate
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.fetch.batch-size=50

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/migration/db.changelog-master.yaml
quarkus.liquibase.clean-at-start=false
quarkus.liquibase.validate-on-migrate=true
# Ensure included changelogs and SQL files are embedded in the GraalVM native executable.
quarkus.native.resources.includes=db/migration/**

# Micrometer / health
quarkus.micrometer.export.prometheus.enabled=true

# OpenTelemetry (traceId for log correlation; no export backend)
quarkus.otel.traces.exporter=none
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none

# HTTP access log (request entry/exit without controller boilerplate)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %D

# Logging
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId} userId=%X{userId} [%c{3.}] (%t) %s%e%n
quarkus.banner.enabled=false
quarkus.log.category."com.portfolio".level=INFO

# OpenAPI
quarkus.smallrye-openapi.info-title=Portfolio Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Combined transactions and portfolio service. Transaction ledger is the source of truth; positions and quant data are derived on read. Multi-user via X-User-Id header.
quarkus.smallrye-openapi.info-contact-email=support@portfolio.com
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.servers=http://localhost:8087
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.store-schema-directory=build/generated/openapi

# Market data provider
application.market-data.providers=${MARKET_DATA_PROVIDERS:eodhd}
application.market-data.twelve-data.api-key=${TWELVE_DATA_API_KEY:not-configured}
quarkus.rest-client.twelve-data-api.url=https://api.twelvedata.com
application.market-data.eodhd.api-key=${EODHD_API_KEY:not-configured}
quarkus.rest-client.eodhd-api.url=https://eodhd.com
application.market-data.eodhd.exchange-catalog-ttl=PT24H
application.market-data.eodhd.rate-limit.requests-per-minute=1000
application.market-data.eodhd.rate-limit.max-wait=PT2M
# EODHD's exchange reference currency can describe the major currency even when prices are quoted
# in a minor unit. London-listed equity prices are pence sterling and must be normalized to GBP.
application.market-data.eodhd.exchange-price-currency-overrides.LSE=GBX

# Minor-unit currency codes a provider may report (e.g. LSE pence sterling) mapped to the major
# ISO currency and the multiplier to rescale the quoted price. Add an entry here to support a
# new exchange's minor-unit convention without a code change; format is CURRENCY:MULTIPLIER.
application.market-data.currency-minor-units.GBX=GBP:0.01
application.market-data.currency-minor-units.GBp=GBP:0.01

# Spot quote freshness windows
application.market-data.spot-price-freshness=PT15M
application.market-data.fx-freshness=PT1H

# A PENDING/RUNNING ingestion run older than this (measured from started_at, or created_at if
# never started) is treated as dead e.g. the process crashed mid-run and reaped to FAILED
# so it stops permanently blocking new triggers (including the daily cron).
application.market-data.ingestion.stale-run-timeout=PT3H

# Shared client-side budget for all TwelveData calls (free tier: 8 credits/min).
application.market-data.twelve-data.rate-limit.credits-per-minute=8
# Max time a call may queue for a slot before failing with 503 + Retry-After.
application.market-data.twelve-data.rate-limit.max-wait=PT2M

# Portfolio valuation base currency
application.portfolio.base-currency=${PORTFOLIO_BASE_CURRENCY:USD}

# Max span (in days) accepted by from/to date-range queries (daily history, price history,
# valuation history, capital flows, performance inputs). Guards against e.g. from=1900-01-01
# building an unbounded day-by-day list in memory. Default 5500 accommodates the frontend's
# 15-year "All" preset, including leap days, while retaining a finite server-side guard.
application.portfolio.max-query-range-days=5500

# Short-lived in-process cache (burst absorption only; Postgres is the store)
quarkus.cache.caffeine.stock-prices.initial-capacity=100
quarkus.cache.caffeine.stock-prices.maximum-size=1000
quarkus.cache.caffeine.stock-prices.expire-after-write=PT5M
quarkus.cache.caffeine.exchange-rates.initial-capacity=20
quarkus.cache.caffeine.exchange-rates.maximum-size=200
quarkus.cache.caffeine.exchange-rates.expire-after-write=PT5M

%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.log.category."com.portfolio".level=INFO

# Domain events (Redis Streams). Best-effort: publish failures are logged, never fail the write.
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.timeout=3s
application.events.transaction-created.stream=transaction:created
application.events.transaction-created.max-length=10000
