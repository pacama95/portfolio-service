# Quarkus HTTP Configuration
quarkus.http.port=${PORT:8087}
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,cache-control,connection,x-request-id,x-user-id
quarkus.http.cors.exposed-headers=content-type,cache-control,connection,x-request-id
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.access-control-max-age=3600

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PGUSER:postgres}
quarkus.datasource.password=${PGPASSWORD:portfolio_service_pass}
quarkus.datasource.reactive.url=postgresql://${PGHOST:localhost}:${PGPORT:5436}/${PGDATABASE:portfolio_service_db}
quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5436}/${PGDATABASE:portfolio_service_db}
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.idle-timeout=PT10M

# Hibernate
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.fetch.batch-size=50

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/migration/db.changelog-master.yaml
quarkus.liquibase.clean-at-start=false
quarkus.liquibase.validate-on-migrate=true

# Micrometer / health
quarkus.micrometer.export.prometheus.enabled=true

# OpenTelemetry (traceId for log correlation; no export backend)
quarkus.otel.traces.exporter=none
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none

# HTTP access log (request entry/exit without controller boilerplate)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %D

# Logging
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId} userId=%X{userId} [%c{3.}] (%t) %s%e%n
quarkus.banner.enabled=false
quarkus.log.category."com.portfolio".level=INFO

# OpenAPI
quarkus.smallrye-openapi.info-title=Portfolio Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Combined transactions and portfolio service. Transaction ledger is the source of truth; positions and quant data are derived on read. Multi-user via X-User-Id header.
quarkus.smallrye-openapi.info-contact-email=support@portfolio.com
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.servers=http://localhost:8087
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.store-schema-directory=build/generated/openapi

# Market data provider
application.market-data.twelve-data.api-key=${TWELVE_DATA_API_KEY:not-configured}
quarkus.rest-client.twelve-data-api.url=https://api.twelvedata.com

# Spot quote freshness windows
application.market-data.spot-price-freshness=PT15M
application.market-data.fx-freshness=PT1H

# Portfolio valuation base currency
application.portfolio.base-currency=${PORTFOLIO_BASE_CURRENCY:USD}

# Short-lived in-process cache (burst absorption only; Postgres is the store)
quarkus.cache.caffeine.stock-prices.initial-capacity=100
quarkus.cache.caffeine.stock-prices.maximum-size=1000
quarkus.cache.caffeine.stock-prices.expire-after-write=PT5M
quarkus.cache.caffeine.exchange-rates.initial-capacity=20
quarkus.cache.caffeine.exchange-rates.maximum-size=200
quarkus.cache.caffeine.exchange-rates.expire-after-write=PT5M

%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.log.category."com.portfolio".level=INFO
