# Shared test defaults. Integration tests override via QuarkusTestResource + integrationTest/resources.
quarkus.datasource.devservices.enabled=false
# Tests pin the provider chain they exercise; production is free to run a different one.
application.market-data.providers=twelvedata,eodhd
application.market-data.twelve-data.api-key=test-api-key
application.market-data.eodhd.api-key=test-eodhd-api-key
application.market-data.spot-price-freshness=PT15M
application.market-data.fx-freshness=PT1H
application.portfolio.base-currency=USD
